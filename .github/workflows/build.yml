name: Build iOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Capacitor CLI
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/ios

      - name: Create www directory and index.html
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>KOMEX</title></head><body><h1>KOMEX App</h1></body></html>' > www/index.html
          fi

      - name: Create Capacitor Config
        run: |
          echo '{
            "appId": "com.komex.messenger",
            "appName": "KOMEX",
            "webDir": "www"
          }' > capacitor.config.json

      - name: Add Capacitor iOS
        run: |
          npx cap add ios || true

      - name: Set iOS Deployment Target and Fix Podfile
        run: |
          if [ -d ios/App ]; then
            # Xcode 프로젝트 파일 전체의 배포 버전을 14.0으로 강제 고정
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g' ios/App/App.xcodeproj/project.pbxproj || true
            
            # Podfile 상단에 플랫폼 버전을 14.0으로 명시적으로 주입
            if [ -f ios/App/Podfile ]; then
              if ! grep -q "platform :ios" ios/App/Podfile; then
                echo "platform :ios, '14.0'" | cat - ios/App/Podfile > temp && mv temp ios/App/Podfile
              else
                sed -i '' "s/platform :ios, '.*'/platform :ios, '14.0'/g" ios/App/Podfile || true
              fi
            fi
          fi

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios

      - name: Final Patch Deployment Target
        run: |
          if [ -d ios/App ]; then
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g' ios/App/App.xcodeproj/project.pbxproj || true
          fi

      - name: Build iOS Project
        env:
          ARCHS: "x86_64"
        run: |
          cd ios/App
          pod install
          cd ../..
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug build CODE_SIGNING_ALLOWED=NO
