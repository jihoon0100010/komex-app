name: Build iOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Capacitor CLI
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/ios

      - name: Create www directory and index.html
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>KOMEX</title></head><body><h1>KOMEX App</h1></body></html>' > www/index.html
          fi

      - name: Create Capacitor Config
        run: |
          echo '{
            "appId": "com.komex.messenger",
            "appName": "KOMEX",
            "webDir": "www"
          }' > capacitor.config.json

      - name: Add Capacitor iOS
        run: |
          npx cap add ios || true

      - name: Force Fix Podfile and Deployment Target First
        run: |
          mkdir -p ios/App
          cat << 'EOF' > ios/App/Podfile
          require_relative '../../node_modules/@capacitor/ios/scripts/pods'

          platform :ios, '14.0'
          use_frameworks!

          target 'App' do
            capacitor_pods
          end
          EOF

          if [ -f ios/App/App.xcodeproj/project.pbxproj ]; then
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g' ios/App/App.xcodeproj/project.pbxproj || true
          fi

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios

      - name: Build iOS Project
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug build CODE_SIGNING_ALLOWED=NO
