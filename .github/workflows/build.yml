name: Build iOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Capacitor CLI & iOS
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/ios

      - name: Create www directory and index.html
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>KOMEX</title></head><body><h1>KOMEX App</h1></body></html>' > www/index.html
          fi

      - name: Create Capacitor Config
        run: |
          echo '{
            "appId": "com.komex.messenger",
            "appName": "KOMEX",
            "webDir": "www"
          }' > capacitor.config.json

      - name: Add Capacitor iOS
        run: |
          npx cap add ios || true

      - name: Fix Podfile and Deployment Target to 16.0
        run: |
          if [ -f ios/App/Podfile ]; then
            if ! grep -q "platform :ios" ios/App/Podfile; then
              echo "platform :ios, '16.0'" | cat - ios/App/Podfile > temp && mv temp ios/App/Podfile
            else
              sed -i '' "s/platform :ios, '.*'/platform :ios, '16.0'/g" ios/App/Podfile || true
            fi
          fi

          if [ -f ios/App/App.xcodeproj/project.pbxproj ]; then
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' ios/App/App.xcodeproj/project.pbxproj || true
          fi

      - name: Copy Capacitor Assets
        run: |
          npx cap copy ios

      - name: Run Pod Install Manually
        run: |
          cd ios/App
          pod install

      - name: Build iOS Project
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath ios/App/build build CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-output
          path: ios/App/build/
